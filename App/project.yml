# XcodeGen spec for the Origin app.
#
# The app is a thin SwiftUI shell over the SwiftPM package at the repository root
# (library product `OriginKit`), which is where everything testable lives.
#
#   xcodegen generate --spec App/project.yml --project App
#
# Signing is deliberately off: the entitlements a package manager needs cannot be
# granted by an Apple signing identity, so the bundle is signed on the device by
# `ldid` in Packaging/build-deb.sh.
name: Origin

options:
  bundleIdPrefix: com.r0gueee
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  groupSortPosition: top
  # Written explicitly so CI (Xcode 15) and a newer local Xcode agree about the
  # project file. XcodeGen's own default (77) is unreadable by older Xcode.
  xcodeVersion: "15.0"
  objectVersion: 56

packages:
  Origin:
    path: ..

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_STRICT_CONCURRENCY: minimal
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""

targets:
  Origin:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
    dependencies:
      - package: Origin
        product: OriginKit
    settings:
      base:
        PRODUCT_NAME: Origin
        PRODUCT_BUNDLE_IDENTIFIER: com.r0gueee.origin
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Origin.entitlements
        # No asset catalogue yet; without this Xcode fails on a missing AppIcon.
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        SWIFT_EMIT_LOC_STRINGS: NO
        ENABLE_ONLY_ACTIVE_ARCH: NO

schemes:
  Origin:
    build:
      targets:
        Origin: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
